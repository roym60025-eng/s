name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      create_release:
        description: "Publish APK as a GitHub Release (direct .apk download without zip)"
        required: false
        type: boolean
        default: true
      release_tag:
        description: "Release tag name (used when creating a Release via manual run)"
        required: false
        type: string
        default: "latest-apk"

permissions:
  contents: write

jobs:
  build-apk:
    name: Assemble Manoj & Sonali APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Configure Android SDK and accept licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          mkdir -p "$SDK_DIR/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > "$SDK_DIR/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n" > "$SDK_DIR/licenses/android-sdk-preview-license"
          printf "\n33b6a2b64607f11b759f320ef9dff4ae5c47d97a\n" > "$SDK_DIR/licenses/google-gdk-license"

          SDKMANAGER=""
          if [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          fi

          if [ -n "$SDKMANAGER" ]; then
            echo "Using sdkmanager: $SDKMANAGER"
            (yes || true) | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" --install "platform-tools" "platforms;android-36.1" "build-tools;36.0.0" > /dev/null 2>&1 \
              || "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 \
              || true
          fi
          echo "Using Android SDK at: $SDK_DIR"

      - name: Install Gradle 9.3.1
        run: |
          GRADLE_DIR="$RUNNER_TEMP/gradle-tool"
          mkdir -p "$GRADLE_DIR"
          curl -fsSL -o "$GRADLE_DIR/gradle.zip" "https://services.gradle.org/distributions/gradle-9.3.1-bin.zip"
          unzip -q "$GRADLE_DIR/gradle.zip" -d "$GRADLE_DIR"
          rm -f "$GRADLE_DIR/gradle.zip"
          echo "$GRADLE_DIR/gradle-9.3.1/bin" >> "$GITHUB_PATH"

      - name: Prepare environment and debug keystore
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          gradle --version
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Restored app/google-services.json from GitHub Secret."
          elif [ ! -f app/google-services.json ]; then
            echo "Notice: app/google-services.json not present. APK will build cleanly, and you can add GOOGLE_SERVICES_JSON in GitHub Repo Secrets for full Firebase functionality."
          fi
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
            echo "Using debug.keystore from DEBUG_KEYSTORE_BASE64 secret."
          elif [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Using debug.keystore decoded from debug.keystore.base64."
          elif [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated temporary debug.keystore."
          fi
          ls -la app/

      - name: Build Debug APK
        run: |
          set -o pipefail
          gradle assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --console=plain \
            --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
            2>&1 | tee gradle-build.log

      - name: Show concise error summary on failure
        if: failure() && hashFiles('gradle-build.log') != ''
        run: |
          echo "=== Gradle Failure Summary ==="
          grep -nE "^(e: |FAILURE:|\* What went wrong:|> Task .* FAILED|Caused by:|Execution failed)" gradle-build.log | tail -n 60 || tail -n 80 gradle-build.log

      - name: Upload Build Log on failure
        if: failure() && hashFiles('gradle-build.log') != ''
        uses: actions/upload-artifact@v7
        with:
          name: gradle-build-log
          path: gradle-build.log
          retention-days: 7

      - name: Build Signed Release APK (optional, when GitHub Secrets are set)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
            gradle assembleRelease --no-daemon --no-configuration-cache --console=plain --max-workers=2 \
              -Dorg.gradle.jvmargs="-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"
          else
            echo "Release signing secrets not configured; skipping release APK (Debug APK already built)."
          fi

      - name: Collect and verify APK files
        run: |
          mkdir -p dist-apk
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk dist-apk/Manoj-and-Sonali-debug.apk
          fi
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist-apk/Manoj-and-Sonali-release.apk
          fi
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -n "$APKSIGNER" ]; then
            for apk in dist-apk/*.apk; do
              echo "Verifying $apk ..."
              "$APKSIGNER" verify --verbose "$apk"
            done
          fi
          ls -lh dist-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Manoj-and-Sonali-APK
          path: dist-apk/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish Direct Download Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true) }}
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
          name: "Manoj & Sonali APK (${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }})"
          files: dist-apk/*.apk
          generate_release_notes: true
